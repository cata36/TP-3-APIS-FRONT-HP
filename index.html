<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Harry Potter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <header>
    <h1>⚡ Personajes de Harry Potter</h1>
    <section class="search-section">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Buscar personaje por nombre..."
        aria-label="Buscar personaje por nombre"
      >
    </section>
  </header>


  <main>
    <section class="grid-container" id="personajesContainer">
      <p class="status-msg">Cargando personajes...</p>
    </section>
  </main>


  <footer>
    <p>Consumiendo la API de HP-API</p>
  </footer>


  <script>
    let personajes = [];
    const container = document.getElementById('personajesContainer');
    const searchInput = document.getElementById('searchInput');


    fetch('https://hp-api.onrender.com/api/characters')
      .then(response => response.json())
      .then(data => {
        console.log(data);
        personajes = data; 
        mostrarPersonajes(personajes);
      })
      .catch(error => {
        console.error('Error en el fetch:', error);
        container.innerHTML = '<p class="status-msg">Error al cargar los personajes.</p>';
      });


    searchInput.addEventListener('input', () => {
      const texto = searchInput.value.toLowerCase();
     
      const filtrados = personajes.filter(p =>
        p.name.toLowerCase().includes(texto)
      );
     
      mostrarPersonajes(filtrados);
    });


    function mostrarPersonajes(lista) {
      container.innerHTML = ''; 


      if (lista.length === 0) {
        container.innerHTML = '<p class="status-msg">No se encontraron personajes.</p>';
        return;
      }


      lista.forEach(p => {
        const foto = p.image !== ''
          ? p.image
          : 'https://via.placeholder.com/210x260/2a2a38/e0a96d?text=Sin+Foto';


        const card = document.createElement('article');
        card.classList.add('card');


        card.innerHTML = `
          <figure>
            <img src="${foto}" alt="${p.name}">
          </figure>
          <h2>${p.name}</h2>
          <p>Casa: ${p.house || 'Desconocida'}</p>
        `;


        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
